  - id: FB-001
    severity: MAJOR
    section: "2. Usuarios / 4. Estado deseado"
    reviewer: modelo
    role: autoevaluacion
    comment: >
      "Confirmacion" nombra dos cosas distintas. U03 dice "recibir confirmacion y
      recordatorio" (aviso de que el turno quedo reservado) y la seccion 4 declara
      fuera de alcance "confirmacion del paciente" (que el paciente confirme
      asistencia). Leido de corrido parece una contradiccion, y desarrollo va a
      tener que preguntar cual es cual.
    required_change: >
      Renombrar en la seccion 2 a "aviso de reserva y recordatorio", y dejar
      "confirmacion del paciente" solo para el caso fuera de alcance.
    status: RESUELTO

  - id: FB-002
    severity: MAJOR
    section: "5. Resultados esperados / 7. Urgencia"
    reviewer: modelo
    role: autoevaluacion
    comment: >
      La meta esta en absoluto (menos de 5 turnos perdidos por mes) pero la
      seccion 7 dice que la campana va a aumentar el volumen y que los turnos
      perdidos crecen en proporcion. Con el doble de pacientes, 5 absolutos es
      una meta mucho mas dura, y no se va a poder distinguir si se fallo por el
      producto o porque cambio la base.
    required_change: >
      Expresar la meta tambien en porcentaje sobre la linea de base, y aclarar
      que se recalibra cuando se conozca el tamano de la campana.
    status: RESUELTO

